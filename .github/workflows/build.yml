                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:padding="12dp">
          
                      <com.google.android.material.imageview.ShapeableImageView
                          android:id="@+id/ivThumb"
                          android:layout_width="136dp"
                          android:layout_height="78dp"
                          android:background="?attr/colorSurfaceVariant"
                          android:contentDescription="@string/preview"
                          android:scaleType="centerCrop"
                          app:shapeAppearanceOverlay="@style/ShapeAppearance.VideoGrab.Thumb" />
          
                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="12dp"
                          android:layout_weight="1"
                          android:orientation="vertical">
          
                          <TextView
                              android:id="@+id/tvTitle"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:ellipsize="end"
                              android:maxLines="3"
                              android:textAppearance="?attr/textAppearanceTitleMedium" />
          
                          <TextView
                              android:id="@+id/tvMeta"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="4dp"
                              android:alpha="0.65"
                              android:textAppearance="?attr/textAppearanceBodySmall" />
                      </LinearLayout>
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>
          
              <!-- список форматов -->
              <TextView
                  android:id="@+id/tvFormatsHeader"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:alpha="0.75"
                  android:text="@string/all_formats"
                  android:textAppearance="?attr/textAppearanceTitleSmall" />
          
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvFormats"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_marginTop="8dp"
                  android:layout_weight="1"
                  android:clipToPadding="false"
                  android:paddingBottom="8dp"
                  android:scrollbars="none" />
          
              <!-- прогресс загрузки -->
              <com.google.android.material.card.MaterialCardView
                  android:id="@+id/downloadPanel"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:visibility="gone"
                  app:cardCornerRadius="22dp"
                  app:cardElevation="0dp"
                  app:strokeColor="?attr/colorOutlineVariant"
                  app:strokeWidth="1dp">
          
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="14dp">
          
                      <TextView
                          android:id="@+id/tvDownloadStatus"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:maxLines="2"
                          android:textAppearance="?attr/textAppearanceBodySmall" />
          
                      <com.google.android.material.progressindicator.LinearProgressIndicator
                          android:id="@+id/pbDownload"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:max="100"
                          app:trackCornerRadius="4dp" />
          
                      <Button
                          android:id="@+id/btnCancel"
                          style="@style/Widget.Material3.Button.TextButton"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="end"
                          android:layout_marginTop="4dp"
                          android:text="@string/stop" />
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>
          </LinearLayout>
          __SRC__
          mkdir -p "$(dirname 'app/src/main/res/layout/item_format.xml')"
          cat > 'app/src/main/res/layout/item_format.xml' <<'__SRC__'
          <?xml version="1.0" encoding="utf-8"?>
          <com.google.android.material.card.MaterialCardView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginBottom="8dp"
              android:clickable="true"
              android:focusable="true"
              android:foreground="?attr/selectableItemBackground"
              app:cardCornerRadius="18dp"
              app:cardElevation="0dp"
              app:strokeColor="?attr/colorOutlineVariant"
              app:strokeWidth="1dp">
          
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingStart="14dp"
                  android:paddingTop="12dp"
                  android:paddingEnd="10dp"
                  android:paddingBottom="12dp">
          
                  <ImageView
                      android:layout_width="22dp"
                      android:layout_height="22dp"
                      android:contentDescription="@string/download"
                      android:src="@drawable/ic_download"
                      android:tint="?attr/colorPrimary" />
          
                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="12dp"
                      android:layout_weight="1"
                      android:orientation="vertical">
          
                      <TextView
                          android:id="@+id/tvRowTitle"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:maxLines="1"
                          android:textAppearance="?attr/textAppearanceTitleSmall" />
          
                      <TextView
                          android:id="@+id/tvRowSub"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:alpha="0.6"
                          android:maxLines="2"
                          android:textAppearance="?attr/textAppearanceBodySmall" />
                  </LinearLayout>
          
                  <ImageView
                      android:layout_width="20dp"
                      android:layout_height="20dp"
                      android:alpha="0.45"
                      android:contentDescription="@string/download"
                      android:src="@drawable/ic_arrow"
                      android:tint="?attr/colorOnSurface" />
              </LinearLayout>
          </com.google.android.material.card.MaterialCardView>
          __SRC__
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'__SRC__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          __SRC__
          mkdir -p "$(dirname 'app/src/main/res/values-night/colors.xml')"
          cat > 'app/src/main/res/values-night/colors.xml' <<'__SRC__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brand">#FF7A8A</color>
              <color name="brand_on">#3A0A12</color>
              <color name="brand_container">#5B1622</color>
              <color name="brand_on_container">#FFE2E6</color>
          </resources>
          __SRC__
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          cat > 'app/src/main/res/values/colors.xml' <<'__SRC__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="brand">#F0334A</color>
              <color name="brand_on">#FFFFFF</color>
              <color name="brand_container">#FFE2E6</color>
              <color name="brand_on_container">#3A0A12</color>
          
              <color name="ic_launcher_background">#101418</color>
              <color name="accent">#F0334A</color>
          </resources>
          __SRC__
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'__SRC__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">VideoGrab</string>
              <string name="tagline">ссылка → превью → 1080p в один тап</string>
              <string name="url_hint">Ссылка на видео</string>
              <string name="find">Найти видео</string>
              <string name="popular_formats">Популярные форматы</string>
              <string name="all_formats">Все форматы</string>
              <string name="preview">Превью</string>
              <string name="stop">Остановить</string>
              <string name="download">Скачать</string>
              <string name="update_ytdlp">Обновить</string>
          </resources>
          __SRC__
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'__SRC__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
          
              <style name="Theme.VideoGrab" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/brand</item>
                  <item name="colorOnPrimary">@color/brand_on</item>
                  <item name="colorPrimaryContainer">@color/brand_container</item>
                  <item name="colorOnPrimaryContainer">@color/brand_on_container</item>
                  <item name="colorSecondary">@color/brand</item>
                  <item name="android:windowBackground">?attr/colorSurface</item>
              </style>
          
              <style name="ShapeAppearance.VideoGrab.Thumb" parent="">
                  <item name="cornerFamily">rounded</item>
                  <item name="cornerSize">14dp</item>
              </style>
          </resources>
          __SRC__
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'__SRC__'
          // VideoGrab - root build script
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          __SRC__
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'__SRC__'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          __SRC__
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'__SRC__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "VideoGrab"
          include ':app'
          __SRC__

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (предустановлен на раннере)
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk dir: $SDK"
          ls "$SDK/platforms" || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show apk
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGrab-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VideoGrab build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit sources back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ci: materialize project sources"
          git push
